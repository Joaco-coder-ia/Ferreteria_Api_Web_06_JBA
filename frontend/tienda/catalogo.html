<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Catálogo de Ferretería Los Maestros" />
    <title>Catálogo | Ferretería Los Maestros</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body data-raiz="../">
    <!-- Los enlaces conectan páginas independientes sin cambiar vistas con JavaScript. -->
    <header class="site-header">
      <a class="brand" href="../index.html" aria-label="Volver al inicio">
        <img
          class="brand-logo"
          src="../assets/logo/logo-losMaestros.png"
          alt="Ferretería Los Maestros"
        />
        <span
          ><strong>Los Maestros</strong
          ><small>Ferretería y construcción</small></span
        >
      </a>
      <button
        class="menu-button"
        type="button"
        aria-expanded="false"
        aria-controls="main-nav"
      >
        ☰ <span>Menú</span>
      </button>
      <nav id="main-nav" class="main-nav" aria-label="Navegación principal">
        <a href="../index.html">Inicio</a>
        <a href="../tienda/catalogo.html" aria-current="page">Catálogo</a>
        <a href="../tienda/carrito.html"
          >Carrito <span id="cart-count">0</span></a
        >
        <a href="../index.html#nosotros">Nosotros</a>
        <a href="../index.html#blog">Blog</a>
        <a id="nav-contacto" href="../tienda/contacto.html">Contacto</a>
        <a id="nav-cuenta" href="../tienda/cuenta.html" hidden>Mi cuenta</a>
        <a id="nav-ingreso" href="../tienda/inicio-sesion.html">Ingreso</a>
        <a id="nav-admin" href="../admin/index.html" hidden>Administración</a>
        <button id="nav-salir" class="nav-salir" type="button" data-logout hidden>
          Cerrar sesión
        </button>
      </nav>
    </header>
    <main id="app" tabindex="-1">
      <section id="view-catalogo" class="view content-section">
        <div class="section-heading">
          <p class="eyebrow">Catálogo de materiales</p>
          <h1>Encuentra lo que necesites</h1>
          <p id="catalog-status">Cargando productos...</p>
        </div>
        <form id="filter-form" class="filter-bar" novalidate>
          <div>
            <label for="search">Buscar por nombre, marca o código</label>
            <input
              id="search"
              type="search"
              placeholder="Ej.: taladro o HE001"
            />
          </div>

          <div>
            <label for="category">Categoría</label>
            <select id="category">
              <option>Todas</option>
            </select>
          </div>
          <label class="check-label">
            <input id="stock-only" type="checkbox" />
            Sólo con stock
          </label>
        </form>
        <div id="product-grid" class="product-grid"></div>
      </section>
      <p
        id="cart-status"
        class="content-section form-message"
        role="status"
        hidden
      ></p>
    </main>
    <footer class="site-footer">
      <strong>Ferretería Los Maestros</strong>
      <span>La Serena, Región de Coquimbo</span>
      <span>Lun a Vie 8:30-19:00 · Sáb 9:00-14:00</span>
    </footer>
    <!-- Herramientas compartidas primero; comportamiento de esta página al final. -->
    <script src="../js/compartido/utilidades.js"></script>
    <script src="../js/compartido/almacenamiento.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/validaciones/comunes.js"></script>
    <script src="../js/tienda/catalogo.js"></script>
    <script src="../js/tienda/carrito.js"></script>
    <script src="../js/tienda/carrito-panel.js"></script>
  </body>
</html>
